<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="100%" stop-color="#fafaf7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand mark -->
  <rect x="80" y="80" width="80" height="80" rx="18" fill="#111114"/>
  <text x="120" y="138" text-anchor="middle" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="700" font-size="48" fill="#ffffff">H</text>
  <text x="180" y="138" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="700" font-size="36" fill="#18181b">Handle</text>

  <!-- Headline -->
  <text x="80" y="310" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="700" font-size="64" fill="#18181b">Free TikTok username</text>
  <text x="80" y="380" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="700" font-size="64" fill="#18181b">generator with availability check</text>

  <!-- Subhead -->
  <text x="80" y="450" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="500" font-size="28" fill="#4b4b53">Type a keyword, pick a vibe, get 10–20 handle ideas</text>
  <text x="80" y="490" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="500" font-size="28" fill="#4b4b53">that follow TikTok's rules. No signup. No limits.</text>

  <!-- Affiliation / brand badge -->
  <rect x="80" y="540" width="280" height="40" rx="20" fill="#e6f6ec"/>
  <text x="220" y="567" text-anchor="middle" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="600" font-size="18" fill="#137a3f">✓ Free · no signup · no limit</text>

  <!-- Affiliation disclaimer -->
  <text x="80" y="610" font-family="Quicksand, Poppins, Inter, system-ui, sans-serif" font-weight="400" font-size="16" fill="#8a8a93">Not affiliated with, endorsed by, or sponsored by TikTok or ByteDance Ltd.</text>
</svg>
